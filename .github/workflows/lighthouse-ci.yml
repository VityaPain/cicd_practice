name: Lighthouse CI

on:
  push:
    branches:
      - '*' # Запускать для всех веток
  pull_request:
    branches:
      - '*' # Запускать для всех PR

jobs:
  lighthouse-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16' # Укажите вашу версию Node.js

      - name: Install dependencies
        run: |
          npm install

      - name: Run Lighthouse CI
        run: |
          lhci autorun --config .lighthouserc.json

      - name: Check Lighthouse results
        run: |
          ls ./lighthouse-results  # Проверка содержимого папки

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-results
          path: ./lighthouse-results/* # Путь для загрузки артефактов
